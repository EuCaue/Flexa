[project]
name = "flexa"
version = "0.1.0"
description = "A simple GNOME app to convert Windows cursor themes to Linux format."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "pycairo>=1.29.0",
    "pygobject>=3.50.0",
]

[dependency-groups]
dev = [
    "pygobject-stubs>=2.17.0",
    "pyright>=1.1.400",
    "ruff>=0.15.0",
]
