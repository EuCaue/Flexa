[project]
name = "flexa"
version = "1.2.1"
description = "A GNOME app to convert cursor themes between Windows and Linux formats."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "pycairo>=1.29.0",
    "pygobject>=3.50.0",
]

[dependency-groups]
dev = [
    "pygobject-stubs>=2.17.0",
    "pyright>=1.1.400",
    "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["flexa"]

[tool.pyright]
include = ["src"]
pythonPlatform = "Linux"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
