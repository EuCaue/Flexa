name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  python-checks:
    name: Python checks & tests
    runs-on: ubuntu-latest
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v4

      - &native-deps
        name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            pkg-config \
            cmake \
            gettext \
            desktop-file-utils \
            appstream \
            python3-dev \
            libcairo2-dev \
            gobject-introspection \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgirepository-2.0-dev \
            libglib2.0-dev \
            python3-gi \
            python3-gi-cairo \
            python3-cairo \
            curl

      - name: Set up Python 3.11
        if: ${{ !env.ACT }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        if: ${{ !env.ACT }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up uv (local act runner)
        if: ${{ env.ACT }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Python quality checks
        run: |
          uv run --locked ruff check .
          uv run --locked pyright src
          uv run --locked pytest -q

  meson-build:
    name: Meson build & validate
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *native-deps
      - name: Meson build and validate
        run: |
          rm -rf build/ci
          meson setup build/ci
          meson compile -C build/ci
          meson test -C build/ci --print-errorlogs
