name: Release
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (e.g., v1.0.0)"
        default: "v1.0.0"

jobs:
  flatpak:
    uses: ./.github/workflows/build-flatpak.yml

  rpm:
    uses: ./.github/workflows/build-rpm.yml

  deb:
    uses: ./.github/workflows/build-deb.yml

  windows:
    uses: ./.github/workflows/build-windows.yml

  release:
    name: Create Release
    needs: [flatpak, rpm, deb, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download Flatpak artifact
        uses: actions/download-artifact@v4
        with:
          name: flexa-flatpak
      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: flexa-rpm
      - name: Download DEB artifacts
        uses: actions/download-artifact@v4
        with:
          name: flexa-deb
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: flexa-windows-installer
      - name: Generate Release Notes with Checksums
        run: |
          cat << 'EOF' > release_body.md
          ## Flexa ${{ github.event.inputs.tag_name || github.ref_name }}
          ### Installation
          **Flatpak** - Download `flexa.flatpak` below and install:
          ```sh
          flatpak install --user flexa.flatpak
          ```
          **RPM** - Download the RPM files below and install:
          ```sh
          sudo dnf install ./python3-win2xcur-*.rpm ./flexa-*.rpm
          ```
          **DEB** - Download the DEB files below and install:
          ```sh
          sudo apt install ./python3-win2xcur_*.deb ./flexa_*.deb
          ```
          **Windows** - Download `Flexa-Windows-Installer.exe` and run the installer.
          **Flathub** - Coming soon.
          ### SHA256 Checksums
          | File | SHA256 Checksum |
          |------|-----------------|
          EOF
          for f in flexa.flatpak Flexa-Windows-Installer.exe $(find . -name "*.rpm") $(find . -name "*.deb"); do
            if [ -f "$f" ]; then
              sha=$(sha256sum "$f" | cut -d' ' -f1)
              echo "| \`$(basename $f)\` | \`$sha\` |" >> release_body.md
            fi
          done
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Flexa ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: true
          prerelease: true
          generate_release_notes: true
          body_path: release_body.md
          files: |
            flexa.flatpak
            Flexa-Windows-Installer.exe
            **/*.rpm
            **/*.deb
