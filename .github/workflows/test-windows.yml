name: Test Windows Build
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-python
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-numpy
            mingw-w64-x86_64-imagemagick
            mingw-w64-x86_64-glib2
            zip
      - name: Install PyInstaller and dependencies
        run: |
          pip install --break-system-packages pyinstaller
          pip install --break-system-packages --no-deps win2xcur wand
      - name: Compile GSettings Schema
        run: glib-compile-schemas data/
      - name: Build with PyInstaller
        run: |
          # Copy Adwaita icons
          mkdir -p package/share/icons
          cp -r /mingw64/share/icons/Adwaita package/share/icons/

          # Force update the MSYS2 schema cache with our latest schema so PyInstaller bundles the right one
          # (MSYS2 is cached between Github Action runs, so an old schema was stuck there!)
          cp data/io.github.eucaue.flexa.gschema.xml /mingw64/share/glib-2.0/schemas/
          glib-compile-schemas /mingw64/share/glib-2.0/schemas/

          # We must NOT rename libMagickCore/libMagickWand to CORE_RL_*!
          # If we rename them, ImageMagick's own coders (like png.dll) break because they are compiled
          # by MSYS2 to look for 'libMagickCore-7.Q16HDRI-10.dll'.
          # Instead, we tell wand to look for the MSYS2 specific suffix!
          
          # Dynamically detect ImageMagick MSYS2 DLL suffix (e.g. -7.Q16HDRI-10 or -11) to avoid future breakage
          WAND_DLL=$(basename /mingw64/bin/libMagickWand-7.Q16HDRI-*.dll | head -n 1)
          CORE_DLL=$(basename /mingw64/bin/libMagickCore-7.Q16HDRI-*.dll | head -n 1)
          SUFFIX=${WAND_DLL#libMagickWand}
          SUFFIX=${SUFFIX%.dll}

          cp "/mingw64/bin/$WAND_DLL" .
          cp "/mingw64/bin/$CORE_DLL" .

          # Collect ImageMagick coders into package/coders. PyInstaller will
          # inject them directly into the root bundle directory so Windows LoadLibrary
          # can easily resolve their dependencies (like libpng16-16.dll) without path issues.
          # We must ALSO copy .la files because ImageMagick on MSYS2 uses libltdl which requires them!
          mkdir -p package/coders
          cp /mingw64/lib/ImageMagick-*/modules-*/coders/*.dll package/coders/ 2>/dev/null || true
          cp /mingw64/lib/ImageMagick-*/modules-*/coders/*.la package/coders/ 2>/dev/null || true
          
          # Copy ImageMagick config
          mkdir -p package/magick_config
          cp -r /mingw64/etc/ImageMagick-*/* package/magick_config/ 2>/dev/null || true

          # Copy typelibs PyInstaller misses
          TYPELIB_DIR=/mingw64/lib/girepository-1.0
          mkdir -p package/gi_typelibs
          for tl in Gtk-4.0 Gdk-4.0 Gsk-4.0 GdkPixbuf-2.0 Pango-1.0 \
                    PangoCairo-1.0 Graphene-1.0 cairo-1.0 HarfBuzz-0.0; do
            cp "$TYPELIB_DIR/$tl.typelib" package/gi_typelibs/ 2>/dev/null || true
          done

          # Compile UI resources
          glib-compile-resources --sourcedir=src src/flexa.gresource.xml --target=package/share/flexa.gresource

          # PyInstaller runs the entry point as __main__ (no package),
          # so relative imports in main.py fail. Create a wrapper that imports
          # src as a package, matching how flexa.in works.
          cat > flexa_launcher.py << LAUNCHER
          import sys, os
          from gi.repository import Gio
          
          # Fix for CLI processes spawned from a --windowed PyInstaller bundle
          if sys.stdout is None: sys.stdout = open(os.devnull, 'w')
          if sys.stderr is None: sys.stderr = open(os.devnull, 'w')
          
          base_dir = getattr(sys, '_MEIPASS', os.path.dirname(os.path.abspath(__file__)))

          # Force GSettings to use our bundled schema to avoid old schema crashes
          os.environ['GSETTINGS_SCHEMA_DIR'] = os.path.join(base_dir, 'share', 'glib-2.0', 'schemas')
          
          # Set up ImageMagick natively inside the unified environment
          os.environ['MAGICK_HOME'] = base_dir
          # Tell ImageMagick to look for coders in the root directory
          os.environ['MAGICK_CODER_MODULE_PATH'] = base_dir
          os.environ['MAGICK_CONFIGURE_PATH'] = os.path.join(base_dir, 'magick_config')
          os.environ['WAND_MAGICK_LIBRARY_SUFFIX'] = '$SUFFIX'
          
          # Route CLI tools natively inside the same process to eliminate DLL issues
          if len(sys.argv) > 1 and sys.argv[1] == 'win2xcur':
              from win2xcur.main.win2xcur import main
              sys.argv.pop(0)
              sys.exit(main())
          elif len(sys.argv) > 1 and sys.argv[1] == 'x2wincurtheme':
              from win2xcur.main.x2wincurtheme import main
              sys.argv.pop(0)
              sys.exit(main())

          # Register GResource for GTK templates
          resource = Gio.Resource.load(os.path.join(base_dir, 'share', 'flexa.gresource'))
          resource._register()

          # Make src/ importable as a package
          sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
          from src.main import main
          main("dev")
          LAUNCHER

          pyinstaller --noconfirm --onedir --windowed \
            --name flexa \
            --add-binary "$WAND_DLL;." \
            --add-binary "$CORE_DLL;." \
            --add-binary "package/coders/*.dll;." \
            --add-data "package/coders/*.la;." \
            --add-data "package/magick_config;magick_config" \
            --add-data "src;src" \
            --add-data "package/share/flexa.gresource;share" \
            --add-data "data/io.github.eucaue.flexa.gschema.xml;data" \
            --add-data "package/gi_typelibs;gi_typelibs" \
            --hidden-import gi \
            --hidden-import gi.repository.Gtk \
            --hidden-import gi.repository.Gdk \
            --hidden-import gi.repository.Adw \
            --hidden-import gi.repository.Gio \
            --hidden-import gi.repository.GLib \
            --hidden-import gi.repository.GObject \
            --hidden-import gi.repository.GdkPixbuf \
            --hidden-import gi.repository.Pango \
            --hidden-import gi.repository.Graphene \
            --hidden-import gi.overrides.Gtk \
            --hidden-import gi.overrides.Gdk \
            --hidden-import gi.overrides.Gio \
            --hidden-import gi.overrides.GLib \
            --hidden-import gi.overrides.GObject \
            --hidden-import gi.overrides.Pango \
            --hidden-import gi.overrides.GdkPixbuf \
            --hidden-import numpy \
            --hidden-import wand \
            --hidden-import wand.image \
            --hidden-import wand.color \
            --hidden-import win2xcur.main.win2xcur \
            --hidden-import win2xcur.main.x2wincurtheme \
            --hidden-import src.main \
            --hidden-import src.cursor_converter \
            --hidden-import src.preferences \
            --hidden-import src.window \
            flexa_launcher.py

          # Copy bundled resources into the final distribution
          cp -r package/share dist/flexa/
      - name: Zip Release
        run: |
          cd dist
          zip -r flexa-windows.zip flexa/
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: flexa-windows
          path: dist/flexa-windows.zip
